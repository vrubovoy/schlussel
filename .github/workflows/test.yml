name: Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # schloss-ui is a git submodule - the workspace install below
      # touches it too (no --filter), even though the backend never
      # imports from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      # Pinned exactly - "version: 11" lets the action self-update to
      # whatever the latest 11.x is at run time, which broke CI when
      # pnpm 11.12.0 shipped with an internal bug in the self-installer
      # ("Cannot use 'in' operator to search for 'integrity' in
      # undefined"), unrelated to any change in this repo.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter schlussel lint
      - run: pnpm --filter schlussel test

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # schloss-ui is a git submodule, linked via pnpm's workspace:*
      # protocol - needs to be checked out and built before frontend can
      # import from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      # Pinned exactly - "version: 11" lets the action self-update to
      # whatever the latest 11.x is at run time, which broke CI when
      # pnpm 11.12.0 shipped with an internal bug in the self-installer
      # ("Cannot use 'in' operator to search for 'integrity' in
      # undefined"), unrelated to any change in this repo.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zudar107/schloss-ui build
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend test

  publish-preflight:
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: A release tag must sit on a reviewed, merged commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag commit ${GITHUB_SHA} is not an ancestor of origin/main - tag a merged commit." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release ref and refuse to overwrite an existing image tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [[ ! "$tag" =~ $semver ]]; then
            echo "::error::Release ref must be vX.Y.Z SemVer (prerelease allowed; build metadata is not representable in an OCI tag): $tag" >&2
            exit 1
          fi
          for image in schlussel schlussel-frontend; do
            ref="ghcr.io/vrubovoy/${image}:${tag}"
            set +e
            out="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "::error::${ref} already exists - release tags are immutable, use a new version." >&2
              exit 1
            elif printf '%s' "$out" | grep -Eqi 'not found|manifest unknown|no such manifest|MANIFEST_UNKNOWN'; then
              : # an explicit 404 is the only signal that the tag is free
            else
              echo "::error::registry probe for ${ref} was inconclusive (not a clean 404) - refusing to proceed:" >&2
              printf '%s\n' "$out" >&2
              exit 1
            fi
          done

  publish:
    needs: publish-preflight
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The `publish` environment's deployment branch policy (custom: the
    # `main` branch and the `v*` tag pattern only) is the external gate; a
    # feature branch cannot start this job. publish-preflight additionally
    # requires a release tag's commit to be an ancestor of origin/main.
    environment: publish
    permissions:
      contents: read
      packages: write
      # Needed for keyless Cosign/OIDC signing and for the SBOM/provenance
      # attestations below - both mint a short-lived Sigstore identity from
      # this workflow run rather than a stored signing key.
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - image: schlussel
            dockerfile: Dockerfile
          - image: schlussel-frontend
            dockerfile: frontend/Dockerfile
    env:
      IMAGE: ghcr.io/vrubovoy/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the build-time tags (never the release tag yet)
        id: tags
        run: |
          # A per-commit tag always; :latest only on main. The immutable
          # release tag vX.Y.Z is assigned LAST, after signing.
          tags=("${IMAGE}:sha-${GITHUB_SHA}")
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags+=("${IMAGE}:latest")
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # Keyless: cosign mints a short-lived certificate from this workflow's
      # own OIDC identity (no stored signing key) and records the signature
      # in the public Rekor transparency log. Signs the immutable digest,
      # not a mutable tag.
      - name: Sign image with keyless Cosign
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: LAST - assign the immutable release tag to the now-signed digest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="${IMAGE}:${GITHUB_REF#refs/tags/}"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "::error::${ref} appeared during publish - aborting rather than overwriting it." >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$ref" "${IMAGE}@${IMAGE_DIGEST}"
          got="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
          [ "$got" = "$IMAGE_DIGEST" ] || {
            echo "::error::${ref} resolves to ${got}, not the signed digest ${IMAGE_DIGEST}" >&2; exit 1; }
