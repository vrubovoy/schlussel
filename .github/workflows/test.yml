name: Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # schloss-ui is a git submodule - the workspace install below
      # touches it too (no --filter), even though the backend never
      # imports from it.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Pinned exactly - "version: 11" lets the action self-update to
      # whatever the latest 11.x is at run time, which broke CI when
      # pnpm 11.12.0 shipped with an internal bug in the self-installer
      # ("Cannot use 'in' operator to search for 'integrity' in
      # undefined"), unrelated to any change in this repo.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter schlussel lint
      - run: pnpm --filter schlussel test

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # schloss-ui is a git submodule, linked via pnpm's workspace:*
      # protocol - needs to be checked out and built before frontend can
      # import from it.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Pinned exactly - "version: 11" lets the action self-update to
      # whatever the latest 11.x is at run time, which broke CI when
      # pnpm 11.12.0 shipped with an internal bug in the self-installer
      # ("Cannot use 'in' operator to search for 'integrity' in
      # undefined"), unrelated to any change in this repo.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zudar107/schloss-ui build
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend test

  publish-preflight:
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release ref and refuse overwrite
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [[ ! "$tag" =~ $semver ]]; then
            echo "::error::Release ref must be vX.Y.Z SemVer (prerelease allowed; build metadata is not representable in an OCI tag): $tag" >&2
            exit 1
          fi
          for image in schlussel schlussel-frontend; do
            ref="ghcr.io/vrubovoy/${image}:${tag}"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "::error::${ref} already exists - release tags are immutable, use a new version." >&2
              exit 1
            fi
          done

  publish:
    needs: publish-preflight
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed for keyless Cosign/OIDC signing and for the SBOM/provenance
      # attestations below - both mint a short-lived Sigstore identity from
      # this workflow run rather than a stored signing key.
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - image: schlussel
            dockerfile: Dockerfile
          - image: schlussel-frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          image="ghcr.io/vrubovoy/${{ matrix.image }}"
          tags=("$image:${GITHUB_SHA}")
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags+=("$image:latest")
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            tags+=("$image:${GITHUB_REF#refs/tags/}")
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # Keyless: cosign mints a short-lived certificate from this workflow's
      # own OIDC identity (no stored signing key) and records the signature
      # in the public Rekor transparency log. Signs the immutable digest,
      # not a mutable tag - `cosign verify` on any tag above resolves to
      # this same signed digest.
      - name: Sign image with keyless Cosign
        run: cosign sign --yes "ghcr.io/vrubovoy/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/vrubovoy/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ghcr.io/vrubovoy/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/vrubovoy/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
