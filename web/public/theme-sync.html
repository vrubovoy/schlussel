<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>theme-sync</title>
</head>
<body>
<script>
// Cross-origin theme-sync hub. schloss and kuvert each embed this page in
// a hidden iframe (schlussel is already the platform's account/identity
// authority, so it doubles as the shared store for this one small
// preference too) since their own localStorage can't be read/written
// directly from another origin. Plain vanilla JS on purpose - this is a
// static file, not part of the React app, so it has to work standalone.
//
// Storage keys match @zudar107/schloss-ui's lib/theme.ts exactly - this
// origin's own pages (schlussel itself) already read/write the same
// keys directly, so there's nothing extra to keep in sync for schlussel
// itself, only for the other two origins asking through here.
(function () {
  'use strict'

  var STORAGE_KEY = 'schloss-theme'
  var UPDATED_AT_KEY = 'schloss-theme-updated-at'
  var THEMES = ['light', 'dark', 'oled', 'sepia']

  // Derives the platform's shared base domain from this page's own
  // hostname (e.g. "auth.localhost" -> "localhost", "auth.example.com"
  // -> "example.com") instead of hardcoding one, so this works the same
  // in local dev and in a real deployment. Only messages from this
  // origin or one of its sibling subdomains are trusted.
  var baseDomain = window.location.hostname.replace(/^auth\./, '')

  function isTrustedOrigin(origin) {
    try {
      var host = new URL(origin).hostname
      return host === baseDomain || host.slice(-(baseDomain.length + 1)) === '.' + baseDomain
    } catch (e) {
      return false
    }
  }

  function getValue() {
    var theme = localStorage.getItem(STORAGE_KEY)
    if (THEMES.indexOf(theme) === -1) theme = null
    var updatedAt = Number(localStorage.getItem(UPDATED_AT_KEY))
    if (!isFinite(updatedAt)) updatedAt = 0
    return { theme: theme, updatedAt: updatedAt }
  }

  function setValue(theme, updatedAt) {
    localStorage.setItem(STORAGE_KEY, theme)
    localStorage.setItem(UPDATED_AT_KEY, String(updatedAt))
  }

  function replyTo(origin) {
    if (window.parent === window) return
    var value = getValue()
    window.parent.postMessage(
      { type: 'schloss-theme-sync:value', theme: value.theme, updatedAt: value.updatedAt },
      origin,
    )
  }

  // Multiple hub iframes can be open at once - one per consumer app tab -
  // and they all share this same origin regardless of which app embeds
  // them, so a same-origin BroadcastChannel reaches every one of them
  // live, without any of them needing to poll or reload to notice a
  // change made via a different app.
  var channel = 'BroadcastChannel' in window ? new BroadcastChannel('schloss-theme-sync') : null

  // Remembered from the last trusted message this specific hub instance
  // received, so an update relayed via BroadcastChannel (which carries no
  // origin of its own to reply to) can still be pushed back to whichever
  // app embedded *this* iframe.
  var parentOrigin = null

  window.addEventListener('message', function (event) {
    if (!isTrustedOrigin(event.origin)) return
    var data = event.data
    if (!data || typeof data !== 'object') return
    parentOrigin = event.origin

    if (data.type === 'schloss-theme-sync:hello') {
      replyTo(event.origin)
      return
    }

    if (data.type === 'schloss-theme-sync:push' && THEMES.indexOf(data.theme) !== -1 && typeof data.updatedAt === 'number') {
      var current = getValue()
      if (data.updatedAt > current.updatedAt) {
        setValue(data.theme, data.updatedAt)
        if (channel) channel.postMessage({ theme: data.theme, updatedAt: data.updatedAt })
      }
    }
  })

  if (channel) {
    channel.onmessage = function (event) {
      var msg = event.data
      if (!msg || THEMES.indexOf(msg.theme) === -1) return
      var current = getValue()
      if (msg.updatedAt > current.updatedAt) setValue(msg.theme, msg.updatedAt)
      // Whatever origin embedded *this* hub instance gets the fresh value
      // too, even though the update actually came from a sibling hub
      // instance embedded in a different app's tab.
      if (parentOrigin) replyTo(parentOrigin)
    }
  }
})()
</script>
</body>
</html>
